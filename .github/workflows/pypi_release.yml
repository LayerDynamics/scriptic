name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # For PyPI trusted publishing

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/scriptic

    steps:
      # Manual checkout instead of using actions/checkout
      - name: Checkout repository
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.ref }}

      # Use system Python instead of actions/setup-python
      - name: Set up Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          echo "PATH=$PATH:$PWD/venv/bin" >> $GITHUB_ENV

      # Build the package
      - name: Build package
        run: |
          source venv/bin/activate
          pip install build
          python -m build
          ls -la dist/

      # Upload to PyPI directly using twine instead of the PyPI action
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          source venv/bin/activate
          pip install twine
          twine upload dist/*
